<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACCESSBRIDGE</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="mark" aria-hidden="true">A</div>
      <div>
        <h1>ACCESSBRIDGE</h1>
        <p class="subtitle">Understand this page</p>
      </div>
    </header>

    <label for="language">Explanation language</label>
    <select id="language">
      <option value="Hindi">Hindi</option>
      <option value="English">English</option>
    </select>

    <button id="explain" class="primary">Explain this page</button>
    <div class="actions">
      <button id="read" disabled>Read again</button>
      <button id="stop" disabled>Stop</button>
    </div>

    <section aria-live="polite" aria-atomic="true">
      <p id="status" class="status">Ready. Open a website and choose Explain this page.</p>
      <div id="result" class="result"></div>
    </section>
    <footer>Preview MVP · Keep sensitive information private</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
